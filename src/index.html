
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій калькулятор</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator">
    <div class="heading">
      <span class="label">SMART CALC</span>
      <h1>Калькулятор</h1>
      <p>Обчислюй легко та швидко</p>
    </div>

    <div class="input-group">
      <label for="firstNumber">Перше число</label>
      <input
        type="text"
        id="firstNumber"
        placeholder="Введіть перше число"
        autocomplete="off"
      >
    </div>

    <div class="input-group">
      <label for="secondNumber">Друге число</label>
      <input
        type="text"
        id="secondNumber"
        placeholder="Введіть друге число"
        autocomplete="off"
      >
    </div>

    <p class="section-title">Оберіть математичну дію</p>

    <div class="operations">
      <button type="button" data-operation="add">+</button>
      <button type="button" data-operation="subtract">−</button>
      <button type="button" data-operation="multiply">×</button>
      <button type="button" data-operation="divide">÷</button>
    </div>

    <div class="result-box" aria-live="polite">
      <span>Результат обчислення</span>
      <p id="result">—</p>
    </div>

    <p id="errorMessage" class="error" role="alert"></p>

    <button type="button" id="clearButton" class="clear-button">
      Очистити все
    </button>
  </main>
</body>
</html>
